<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="우리 둘의 저녁 당번 기록장 — 랜덤 메뉴 뽑기, 메뉴판, 저녁 이력 관리" />
    <meta name="theme-color" content="#F4F5EA" />
    <title>오늘 저녁 뭐 먹지? — 둘이 먹는 저녁 기록부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f5ea;
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .boot-dot {
        animation: boot-bob 1.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background: #f4f5ea;
          font-family: sans-serif;
          color: #22301f;
        "
      >
        <div class="boot-dot" style="font-size: 46px; line-height: 1">🍲</div>
        <p style="margin: 0; font-weight: 700; font-size: 19px">오늘 저녁 뭐 먹지?</p>
        <p style="margin: 0; font-size: 13px; color: #5b6752">저녁 기록장을 차리는 중…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
